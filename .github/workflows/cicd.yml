name: CICD

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: [ubuntu-latest]

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t photochitran/reactjs-app:latest .

      - name: Push image to Docker Hub
        run: |
          docker push photochitran/reactjs-app:latest

  deploy:
    needs: build
    runs-on: [aws-ec2]

    steps:
      - name: Pull image
        run: docker pull photochitran/reactjs-app:latest

      - name: Stop & remove old container
        run: |
          docker rm -f reactContainer || true

      - name: Run new container
        run: |
          docker run -d \
            -p 3000:80 \
            --name reactContainer \
            photochitran/reactjs-app:latest
